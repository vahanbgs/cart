[package]
name = "cart"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[build-dependencies]
clap = { version = "4.6.2", features = ["derive"] }
clap_complete = "4.6"
clap_complete_nushell = "4.6"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.2", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories-next = "2.0.0"
fs4 = "0.13"
futures = "0.3.32"
hex = { version = "0.4.3", features = ["serde"] }
image = "0.25.10"
indicatif = "0.18"
inquire = "0.9.4"
ratatui = "0.30"
ratatui-image = { version = "11", default-features = false, features = ["image-defaults", "crossterm"] }
reqwest = { version = "0.13.4", features = ["json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha1 = "0.11.0"
sha2 = "0.11.0"
strum = { version = "0.28.0", features = ["derive"] }
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.3"
toml_edit = "0.25"
tracing = "0.1.44"
tracing-indicatif = "0.3"
tracing-subscriber = { version = "0.3.23", features = ["chrono", "json", "serde", "serde_json", "tracing", "tracing-serde", "fmt", "env-filter", "regex"] }
url = { version = "2.5.8", features = ["serde"] }
viuer = { version = "0.11.0", features = ["icy_sixel", "print-file"] }
zip = "8.6.0"
